server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Standard document root for the official Nginx Docker image
    root /usr/share/nginx/html;
    index index.html;

    # The main routing block for SPA behavior
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|svg|png|gif|ico|eot|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
